<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapporten in 1-2-3</title>
    <!-- XLSX Library voor Excel export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --blue-light: #3b82f6;
            --blue-dark: #1e3a8a;
            --blue-gradient: linear-gradient(135deg, #2563eb, #1e3a8a);
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --status-mic: #ef4444;
            --status-speak: #3b82f6;
            --status-idle: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 2rem;
            color: var(--blue-dark);
            margin-bottom: 6px;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #475569;
        }

        .main-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .btn-start {
            width: 100%;
            padding: 24px 16px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            background: var(--blue-gradient);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(30, 58, 138, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            touch-action: manipulation;
        }

        .btn-action {
            width: 100%;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: bold;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: none;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .status-box {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            background-color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: var(--status-idle);
            flex-shrink: 0;
        }

        .status-dot.listening {
            background-color: var(--status-mic);
            animation: pulse 1.2s infinite alternate;
        }

        .status-dot.speaking {
            background-color: var(--status-speak);
            animation: pulse 1.2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.85); opacity: 0.7; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        .status-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: #334155;
        }

        .display-area {
            width: 100%;
            min-height: 140px;
            max-height: 280px;
            overflow-y: auto;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 14px;
            font-size: 1.1rem;
            color: #1e293b;
            background-color: #fafafa;
            white-space: pre-wrap;
            word-wrap: break-word;
            text-align: left;
        }

        .info-label {
            width: 100%;
            font-size: 0.95rem;
            color: #64748b;
            text-align: left;
            margin-bottom: -12px;
        }

        .logs {
            width: 100%;
            max-width: 500px;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #64748b;
        }

        .log-item {
            background: #fff;
            border: 1px solid #e2e8f0;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            text-align: left;
        }
    </style>
</head>
<body>

    <header>
        <h1>Rapporten in 1-2-3</h1>
        <p class="subtitle">Handsfree spraakgestuurde rapportages</p>
    </header>

    <div class="main-card">
        <button id="btnStart" class="btn-start">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="22"></line>
            </svg>
            START RAPPORT MAKEN
        </button>

        <button id="btnAction" class="btn-action">
            ✅ KLAAR
        </button>

        <div class="status-box">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText" class="status-text">Status: Klaar voor start</span>
        </div>

        <div class="info-label">Live tekst / Weergave:</div>
        <div id="displayArea" class="display-area">Druk op de blauwe knop om te beginnen...</div>
    </div>

    <div class="logs">
        <h3>Gegenereerde Bestanden:</h3>
        <div id="logContainer">Nog geen bestanden aangemaakt.</div>
    </div>

    <script>
        let state = 'IDLE'; 
        let dossierNumber = '';
        let fullReportText = '';       
        let rawDevicesText = '';
        let recognition = null;
        let isListening = false;

        const btnStart = document.getElementById('btnStart');
        const btnAction = document.getElementById('btnAction');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const displayArea = document.getElementById('displayArea');
        const logContainer = document.getElementById('logContainer');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert('Spraakherkenning wordt niet ondersteund in deze browser. Gebruik Google Chrome.');
        } else {
            recognition = new SpeechRecognition();
            recognition.continuous = true;     
            recognition.interimResults = true; 
            recognition.lang = 'nl-NL';

            recognition.onstart = () => {
                isListening = true;
                updateStatusIcon('listening');
            };

            recognition.onend = () => {
                isListening = false;
                if (state.startsWith('LISTENING_')) {
                    try {
                        recognition.start();
                    } catch(e) {}
                } else {
                    updateStatusIcon('idle');
                }
            };

            recognition.onresult = (event) => {
                let currentSessionFinal = '';
                let currentSessionInterim = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        currentSessionFinal += event.results[i][0].transcript + ' ';
                    } else {
                        currentSessionInterim += event.results[i][0].transcript;
                    }
                }

                if (currentSessionFinal.trim() !== '') {
                    if (state === 'LISTENING_REPORT') {
                        fullReportText += ' ' + currentSessionFinal.trim();
                    } else if (state === 'LISTENING_DEVICES') {
                        rawDevicesText += ' ' + currentSessionFinal.trim();
                    }
                }

                if (state === 'LISTENING_REPORT') {
                    const fullLiveView = (fullReportText + ' ' + currentSessionInterim).trim();
                    handleSpeechInput(fullLiveView.toLowerCase(), currentSessionFinal.trim().toLowerCase());
                } else if (state === 'LISTENING_DEVICES') {
                    const fullLiveView = (rawDevicesText + ' ' + currentSessionInterim).trim();
                    handleSpeechInput(fullLiveView.toLowerCase(), currentSessionFinal.trim().toLowerCase());
                } else {
                    const fullLiveView = (currentSessionFinal + currentSessionInterim).trim();
                    handleSpeechInput(fullLiveView.toLowerCase(), currentSessionFinal.trim().toLowerCase());
                }
            };
        }

        function unlockAudioHardware() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const buffer = audioCtx.createBuffer(1, 1, 22050);
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(audioCtx.destination);
                source.start(0);
            } catch(e) {}
        }

        function speakPrompt(text, onComplete) {
            stopListening();
            updateStatusIcon('speaking');
            statusText.innerText = "App spreekt...";

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'nl-NL';
                utterance.rate = 0.95;

                const voices = window.speechSynthesis.getVoices();
                const nlVoice = voices.find(v => v.lang.includes('nl'));
                if (nlVoice) utterance.voice = nlVoice;

                utterance.onend = () => { if (onComplete) onComplete(); };
                utterance.onerror = () => { if (onComplete) onComplete(); };

                window.speechSynthesis.speak(utterance);
            } else {
                if (onComplete) onComplete();
            }
        }

        function stopListening() {
            if (recognition && isListening) {
                try { recognition.stop(); } catch(e) {}
            }
        }

        function startListeningState() {
            if (recognition && !isListening) {
                try { recognition.start(); } catch(e) {}
            }
        }

        function updateStatusIcon(type) {
            statusDot.className = 'status-dot';
            if (type === 'listening') statusDot.classList.add('listening');
            else if (type === 'speaking') statusDot.classList.add('speaking');
        }

        btnStart.addEventListener('click', () => {
            unlockAudioHardware();
            startReportFlow();
        });

        btnAction.addEventListener('click', () => {
            if (state === 'LISTENING_REPORT') {
                finishReport();
            } else if (state === 'LISTENING_EXCEL_PROMPT') {
                handleSpeechInput('ja', 'ja');
            } else if (state === 'LISTENING_DEVICES') {
                finishExcelGeneration();
            } else if (state === 'LISTENING_REPEAT') {
                handleSpeechInput('nee', 'nee');
            }
        });

        function startReportFlow() {
            state = 'ASKING_DOSSIER';
            fullReportText = '';
            rawDevicesText = '';
            dossierNumber = '';
            btnAction.style.display = 'none';
            displayArea.innerText = "Bezig met starten...";
            
            speakPrompt("Geef dossiernummer of naam klant", () => {
                state = 'LISTENING_DOSSIER';
                statusText.innerText = "Luisteren naar dossiernummer...";
                displayArea.innerText = "Spreek nu het dossiernummer of de naam van de klant in...";
                startListeningState();
            });
        }

        function handleSpeechInput(liveText, finalSentence) {
            if (state === 'LISTENING_DOSSIER') {
                if (finalSentence && finalSentence.length > 1) {
                    dossierNumber = finalSentence;
                    displayArea.innerText = `Dossier/Klant: ${dossierNumber}\n\nStart rapport...`;
                    
                    state = 'ASKING_REPORT';
                    speakPrompt("Dicteer me uw rapport en sluit af met de woorden einde rapport", () => {
                        state = 'LISTENING_REPORT';
                        statusText.innerText = "Luisteren naar rapport...";
                        displayArea.innerText = `Dossier: ${dossierNumber}\n\n[Dicteer uw volledige rapport. Zeg 'einde rapport' als u klaar bent]`;
                        btnAction.innerText = "✅ EINDE RAPPORT";
                        btnAction.style.display = 'block';
                        fullReportText = '';
                        startListeningState();
                    });
                }
            } else if (state === 'LISTENING_REPORT') {
                displayArea.innerText = `Dossier: ${dossierNumber}\n\n${fullReportText}`;

                if (liveText.includes('einde rapport') || finalSentence.includes('einde rapport')) {
                    fullReportText = fullReportText.replace(/einde rapport/gi, '').trim();
                    finishReport();
                }
            } else if (state === 'LISTENING_EXCEL_PROMPT') {
                const answer = finalSentence || liveText;
                if (answer.includes('ja') || answer.includes('wel') || answer.includes('graag')) {
                    stopListening();
                    promptForDevicesList();
                } else if (answer.includes('nee') || answer.includes('neen') || answer.includes('niet')) {
                    stopListening();
                    displayArea.innerText += "\n\nGeen Excel-lijst gewenst.";
                    askForAnotherReport();
                }
            } else if (state === 'LISTENING_DEVICES') {
                displayArea.innerText = `Toestellen voor Excel:\n${rawDevicesText}`;

                if (liveText.includes('einde lijst') || finalSentence.includes('einde lijst') || liveText.includes('einde rapport')) {
                    rawDevicesText = rawDevicesText.replace(/einde lijst/gi, '').replace(/einde rapport/gi, '').trim();
                    finishExcelGeneration();
                }
            } else if (state === 'LISTENING_REPEAT') {
                const answer = finalSentence || liveText;
                if (answer.includes('ja') || answer.includes('ja graag') || answer.includes('opnieuw')) {
                    stopListening();
                    startReportFlow();
                } else if (answer.includes('nee') || answer.includes('neen') || answer.includes('stop')) {
                    stopListening();
                    state = 'IDLE';
                    btnAction.style.display = 'none';
                    statusText.innerText = "Status: Afgerond";
                    speakPrompt("Rapportage is afgerond. Veilige rit gewenst.");
                }
            }
        }

        function finishReport() {
            stopListening();
            btnAction.style.display = 'none';
            if (!fullReportText) {
                fullReportText = displayArea.innerText;
            }
            displayArea.innerText = `Dossier: ${dossierNumber}\n\n[Rapport Voltooid & Opgeslagen]:\n${fullReportText}`;

            generateWordFile();

            state = 'ASKING_EXCEL_PROMPT';
            speakPrompt("Heeft u een excellijst nodig van alle technische toestellen?", () => {
                state = 'LISTENING_EXCEL_PROMPT';
                statusText.innerText = "Luisteren naar 'ja' of 'nee'...";
                btnAction.innerText = "Klik voor JA (Excel)";
                btnAction.style.display = 'block';
                startListeningState();
            });
        }

        function promptForDevicesList() {
            rawDevicesText = '';
            state = 'ASKING_DEVICES';
            speakPrompt("Spreek nu de toestellen in en sluit af met einde lijst", () => {
                state = 'LISTENING_DEVICES';
                statusText.innerText = "Luisteren naar toestellen...";
                displayArea.innerText = "Spreek de toestellen in (zeg telkens 'komma' tussen de toestellen). Sluit af met 'einde lijst'.";
                btnAction.innerText = "✅ EINDE LIJST";
                btnAction.style.display = 'block';
                startListeningState();
            });
        }

        function finishExcelGeneration() {
            stopListening();
            btnAction.style.display = 'none';
            generateExcelFile();
            askForAnotherReport();
        }

        function askForAnotherReport() {
            state = 'ASKING_REPEAT';
            speakPrompt("Wil u nog een rapport dicteren?", () => {
                state = 'LISTENING_REPEAT';
                statusText.innerText = "Luisteren naar 'ja' of 'nee'...";
                btnAction.innerText = "Nog een rapport (JA)";
                btnAction.style.display = 'block';
                startListeningState();
            });
        }

        function generateWordFile() {
            const fileName = `Rapport_${dossierNumber.replace(/[^a-zA-Z0-9]/g, '_')}.doc`;
            
            const htmlContent = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head><meta charset='utf-8'><title>Rapport</title>
                <style>
                    body { font-family: Arial, sans-serif; margin: 40px; }
                    h1 { color: #1e3a8a; font-size: 20pt; }
                    .meta { font-size: 11pt; color: #555; margin-bottom: 20px; }
                    .content { font-size: 12pt; line-height: 1.6; }
                </style>
                </head>
                <body>
                    <h1>Technisch Rapport</h1>
                    <div class="meta">
                        <p><strong>Dossier / Klant:</strong> ${dossierNumber}</p>
                        <p><strong>Datum:</strong> ${new Date().toLocaleDateString('nl-BE')} ${new Date().toLocaleTimeString('nl-BE')}</p>
                    </div>
                    <hr/>
                    <div class="content">
                        <h2>Rapportverslag:</h2>
                        <p>${fullReportText.replace(/\n/g, '<br/>')}</p>
                    </div>
                </body>
                </html>
            `;

            const blob = new Blob(['\ufeff' + htmlContent], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            addLogItem(`📄 Word-bestand opgeslagen: <strong>${fileName}</strong> (Kijk in je <strong>Downloads-map</strong> van je telefoon).`);
        }

        function generateExcelFile() {
            let cleanText = rawDevicesText.replace(/\bkomma\b/gi, ',');

            const rawList = cleanText
                .split(/[,.]|\b(?:en|volgende|nieuwe regel)\b/gi)
                .map(item => item.trim())
                .filter(item => item.length > 1 && !['einde', 'lijst', 'rapport', 'ja', 'nee'].includes(item.toLowerCase()));

            const excelData = [["Technische Toestellen"]]; 
            
            if (rawList.length > 0) {
                rawList.forEach(device => {
                    const formatted = device.charAt(0).toUpperCase() + device.slice(1);
                    excelData.push([formatted]); 
                });
            } else {
                excelData.push(["Geen toestellen ingevoerd"]);
            }

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(excelData);
            XLSX.utils.book_append_sheet(wb, ws, "Toestellen");

            const fileName = `Toestellen_${dossierNumber.replace(/[^a-zA-Z0-9]/g, '_')}.xlsx`;
            XLSX.writeFile(wb, fileName);

            addLogItem(`📊 Excel-bestand opgeslagen: <strong>${fileName}</strong> (Kijk in je <strong>Downloads-map</strong> van je telefoon).`);
        }

        function addLogItem(htmlText) {
            if (logContainer.innerText.includes('Nog geen bestanden')) {
                logContainer.innerHTML = '';
            }
            const div = document.createElement('div');
            div.className = 'log-item';
            div.innerHTML = htmlText;
            logContainer.prepend(div);
        }
    </script>
</body>
</html>
